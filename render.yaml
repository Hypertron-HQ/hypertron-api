# Render Blueprint — HyperTone Payments API (staging / production)
# Dashboard: New → Blueprint → connect this repo; set root to hypertron-api
# or place this file at the repo path configured for the service.

services:
  - type: web
    name: hypertron-api-staging
    runtime: node
    plan: starter
    region: oregon
    rootDir: hypertron-api
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: WEBHOOK_SECRET_ENCRYPTION_KEY
        sync: false
      - key: CHECKOUT_BASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: THROTTLE_STORAGE
        value: redis
      - key: DISABLE_WORKERS
        value: 'false'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: OTEL_SDK_DISABLED
        value: 'true'
      - key: RATE_LIMIT_PAYMENT_CREATE_PER_MIN
        value: '60'
      - key: RATE_LIMIT_READ_PER_MIN
        value: '300'
      - key: RATE_LIMIT_DASHBOARD_PER_MIN
        value: '120'
      - key: STELLAR_TESTNET_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_MAINNET_HORIZON_URL
        value: https://horizon.stellar.org
      - key: PAYMENT_POOL_ADDRESS
        sync: false
      - key: STELLAR_TESTNET_DESTINATION_ADDRESS
        sync: false
      - key: STELLAR_MAINNET_DESTINATION_ADDRESS
        sync: false

  - type: web
    name: hypertron-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: hypertron-api
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm exec prisma generate && pnpm build
    startCommand: node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: WEBHOOK_SECRET_ENCRYPTION_KEY
        sync: false
      - key: CHECKOUT_BASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: THROTTLE_STORAGE
        value: redis
      - key: DISABLE_WORKERS
        value: 'false'
      - key: SWAGGER_ENABLED
        value: 'false'
      - key: OTEL_SDK_DISABLED
        value: 'false'
      - key: OTEL_SERVICE_NAME
        value: hypertron-api
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: RATE_LIMIT_PAYMENT_CREATE_PER_MIN
        value: '60'
      - key: RATE_LIMIT_READ_PER_MIN
        value: '300'
      - key: RATE_LIMIT_DASHBOARD_PER_MIN
        value: '120'
      - key: STELLAR_TESTNET_HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: STELLAR_MAINNET_HORIZON_URL
        value: https://horizon.stellar.org
      - key: PAYMENT_POOL_ADDRESS
        sync: false
      - key: STELLAR_TESTNET_DESTINATION_ADDRESS
        sync: false
      - key: STELLAR_MAINNET_DESTINATION_ADDRESS
        sync: false
