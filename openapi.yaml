  description: >-
    Production-grade stablecoin payment gateway API (HyperTone). Public merchant API under `/v1/*` (API key auth).
    Dashboard control-plane under `/api/developer/*` (Freighter session cookie). Contract reference:
    Payments_API_v1_Schema.md.
  version: 1.0.0
  contact: {}
tags:
  - name: Payments
    description: Create, read, list, and cancel payments
  - name: Customers
    description: Merchant-scoped customer records
  - name: Developer
    description: 'Dashboard control-plane: API keys and webhooks'
  - name: Health
    description: Health and readiness checks
servers:
  - url: http://localhost:3000
    description: Local
  - url: https://api.hypertron.xyz
    description: Production
components:
  securitySchemes:
    ApiKey:
      scheme: bearer
      bearerFormat: sk_test_... / sk_live_...
      type: http
      description: Secret API key for /v1 routes
    SessionCookie:
      type: apiKey
      in: cookie
      name: ht_dashboard
      description: Freighter session cookie from hypertron-core-backend (HMAC AUTH_SECRET)
    IdempotencyKey:
      type: apiKey
      in: header
      name: Idempotency-Key
      description: Required for POST /v1/payments
    RequestId:
      type: apiKey
      in: header
      name: X-Request-Id
      description: Optional client correlation id
  schemas:
    HypertronErrorBodyDto:
      type: object
      properties:
        type:
          type: string
          example: invalid_request_error
          enum:
            - invalid_request_error
            - authentication_error
            - permission_error
            - resource_missing
            - idempotency_error
            - invalid_state_transition
            - unprocessable_entity
            - rate_limit_error
            - api_error
            - service_unavailable
        code:
          type: string
          example: invalid_amount
        message:
          type: string
          example: amount must be a positive decimal string
        param:
          type: string
          example: amount
          description: Present only for field-level validation errors
        request_id:
          type: string
          example: req_01J...
      required:
        - type
        - code
        - message
        - request_id
    HypertronErrorResponseDto:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/HypertronErrorBodyDto'
      required:
        - error
    CustomerResponseDto:
      type: object
      properties:
        id:
          type: string
          example: cus_01JABC456
        object:
          type: string
          example: customer
          enum:
            - customer
        business_id:
          type: string
          example: clxyz...
        email:
          type: object
          example: customer@example.com
          nullable: true
        name:
          type: object
          example: Ada Lovelace
          nullable: true
        metadata:
          type: object
          example:
            crm_id: crm_123
          additionalProperties: true
        payment_count:
          type: number
          example: 3
        lifetime_value:
          type: string
          example: '250.00'
          description: Decimal string
        lifetime_value_currency:
          type: string
          example: USDC
        last_payment_at:
          type: object
          example: '2026-08-03T12:31:10.000Z'
          nullable: true
        created_at:
          type: string
          example: '2026-07-01T10:00:00.000Z'
        updated_at:
          type: string
          example: '2026-08-03T12:31:10.000Z'
      required:
        - id
        - object
        - business_id
        - metadata
        - payment_count
        - lifetime_value
        - lifetime_value_currency
        - created_at
        - updated_at
    CustomerListResponseDto:
      type: object
      properties:
        object:
          type: string
          example: list
          enum:
            - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/CustomerResponseDto'
        has_more:
          type: boolean
          example: false
        next_cursor:
          type: object
          example: null
          nullable: true
      required:
        - object
        - data
        - has_more
    ApiKeyResponseDto:
      type: object
      properties:
        id:
          type: string
          example: key_01J...
        object:
          type: object
          example: api_key
        name:
          type: string
          example: Production server
        environment:
          type: string
          enum:
            - test
            - live
          example: test
        key_prefix:
          type: string
          description: Key prefix for display (e.g. sk_test_)
          example: sk_test_
        last_four:
          type: string
          description: Last four characters of the raw key, for identification
          example: abcd
        secret_key:
          type: object
          description: Full raw key — only returned once at creation/rotation. Null on all other responses.
          example: sk_test_ABC123...
          nullable: true
        active:
          type: boolean
          example: true
        last_used_at:
          type: object
          example: '2024-01-01T00:00:00.000Z'
          nullable: true
        created_at:
          type: string
          example: '2024-01-01T00:00:00.000Z'
        revoked_at:
          type: object
          example: null
          nullable: true
      required:
        - id
        - object
        - name
        - environment
        - key_prefix
        - last_four
        - active
        - created_at
    ApiKeyListResponseDto:
      type: object
      properties:
        object:
          type: object
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResponseDto'
      required:
        - object
        - data
    CreateApiKeyDto:
      type: object
      properties:
        name:
          type: string
          description: Human-readable label for this key
          example: Production server
          minLength: 1
          maxLength: 100
        environment:
          type: string
          description: Key environment — test keys cannot access live payments
          enum:
            - test
            - live
          example: test
      required:
        - name
        - environment
    WebhookEndpointResponseDto:
      type: object
      properties:
        id:
          type: string
          example: we_01J...
        object:
          type: object
          example: webhook_endpoint
        url:
          type: string
          example: https://merchant.example.com/hypertron/webhook
        environment:
          type: string
          enum:
            - test
            - live
          example: test
        events:
          example:
            - payment.completed
          type: array
          items:
            type: array
        description:
          type: object
          example: Production order updates
          nullable: true
        active:
          type: boolean
          example: true
        secret_last_four:
          type: string
          example: a1b2
        signing_secret:
          type: object
          description: Raw signing secret — returned only once, on create and rotate-secret.
          nullable: true
        created_at:
          type: string
          example: '2026-08-03T12:30:00.000Z'
        updated_at:
          type: string
          example: '2026-08-03T12:30:00.000Z'
        disabled_at:
          type: object
          example: null
          nullable: true
      required:
        - id
        - object
        - url
        - environment
        - events
        - active
        - secret_last_four
        - created_at
        - updated_at
    WebhookEndpointListResponseDto:
      type: object
      properties:
        object:
          type: object
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointResponseDto'
      required:
        - object
        - data
    CreateWebhookEndpointDto:
      type: object
      properties:
        url:
          type: string
          description: HTTPS URL that receives signed events. Plain http is allowed only for localhost in the test environment.
          example: https://merchant.example.com/hypertron/webhook
        environment:
          type: string
          enum:
            - test
            - live
          example: test
        events:
          type: array
          description: Event types this endpoint subscribes to
          example:
            - payment.completed
            - payment.failed
          items:
            type: string
            enum:
              - payment.created
              - payment.pending
              - payment.confirmed
              - payment.completed
              - payment.failed
              - payment.expired
              - payment.canceled
        description:
          type: string
          example: Production order updates
          maxLength: 500
      required:
        - url
        - environment
        - events
    UpdateWebhookEndpointDto:
      type: object
      properties:
        url:
          type: string
          example: https://merchant.example.com/hooks/v2
        events:
          type: array
          example:
            - payment.completed
          items:
            type: string
            enum:
              - payment.created
              - payment.pending
              - payment.confirmed
              - payment.completed
              - payment.failed
              - payment.expired
              - payment.canceled
        description:
          type: string
          example: Production order updates
          maxLength: 500
        active:
          type: boolean
          description: Set false to stop delivering to this endpoint
          example: true
    DeletedWebhookEndpointResponseDto:
      type: object
      properties:
        id:
          type: string
          example: we_01J...
        object:
          type: object
          example: webhook_endpoint
        deleted:
          type: object
          example: true
      required:
        - id
        - object
        - deleted
    WebhookDeliveryResponseDto:
      type: object
      properties:
        id:
          type: string
          example: whd_01J...
        object:
          type: object
          example: webhook_delivery
        endpoint_id:
          type: string
          example: we_01J...
        event_id:
          type: string
          example: evt_01J...
        status:
          type: string
          enum:
            - pending
            - delivered
            - failed
          example: delivered
        attempt_count:
          type: number
          example: 1
        next_attempt_at:
          type: object
          example: null
          nullable: true
        last_attempt_at:
          type: object
          example: '2026-08-03T12:31:10.000Z'
          nullable: true
        response_status:
          type: object
          example: 200
          nullable: true
        response_body:
          type: object
          description: Truncated to 2 KB for debugging
          nullable: true
        delivered_at:
          type: object
          example: '2026-08-03T12:31:10.000Z'
          nullable: true
        created_at:
          type: string
          example: '2026-08-03T12:31:10.000Z'
      required:
        - id
        - object
        - endpoint_id
        - event_id
        - status
        - attempt_count
        - created_at
    WebhookDeliveryListResponseDto:
      type: object
      properties:
        object:
          type: object
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryResponseDto'
        has_more:
          type: boolean
          example: false
        next_cursor:
          type: object
          example: null
          nullable: true
      required:
        - object
        - data
        - has_more
    TestWebhookResponseDto:
      type: object
      properties:
        object:
          type: object
          example: webhook_test
        delivered:
          type: boolean
          example: true
        response_status:
          type: object
          example: 200
          nullable: true
        response_body:
          type: object
          nullable: true
        error:
          type: object
          description: Transport error when no HTTP response was received
          nullable: true
      required:
        - object
        - delivered
    CreatePaymentDto:
      type: object
      properties:
        amount:
          type: string
          description: Payment amount as a positive decimal string (no scientific notation)
          example: '10.50'
        currency:
          type: string
          description: Currency code
          enum:
            - USDC
            - EURC
            - XLM
          example: USDC
        description:
          type: string
          description: Human-readable description shown on the checkout page
          example: 'Order #1234'
          maxLength: 500
        customer_email:
          type: string
          description: Customer email — used to upsert the merchant-scoped customer record
          example: alice@example.com
        customer_name:
          type: string
          description: Customer display name
          example: Alice Smith
        metadata:
          type: object
          description: Key-value metadata (max 50 pairs, values max 500 chars)
          example:
            order_id: ord_123
          additionalProperties:
            type: string
      required:
        - amount
        - currency
    PaymentResponseDto:
      type: object
      properties:
        id:
          type: string
          example: pay_01JABC123
        object:
          type: string
          example: payment
          enum:
            - payment
        business_id:
          type: string
          example: clxyz...
        environment:
          type: string
          enum:
            - test
            - live
          example: test
        status:
          type: string
          enum:
            - created
            - pending
            - confirmed
            - completed
            - failed
            - expired
            - canceled
          example: pending
        amount:
          type: string
          example: '100.00'
          description: Decimal string amount
        currency:
          type: string
          enum:
            - USDC
            - EURC
            - XLM
          example: USDC
        description:
          type: object
          example: Order ORD123
          nullable: true
        customer_id:
          type: object
          example: cus_01JABC456
          nullable: true
        metadata:
          type: object
          example:
            order_id: ORD123
          additionalProperties: true
        checkout_url:
          type: string
          example: https://pay.hypertron.xyz/pay/...
        link_memo:
          type: string
          example: hpl_abc123
        destination_address:
          type: string
          example: G...
        payer_address:
          type: object
          example: G...
          nullable: true
        transaction_hash:
          type: object
          example: a1b2c3...
          nullable: true
        failure_code:
          type: object
          example: wrong_asset
          nullable: true
        failure_message:
          type: object
          example: Asset code mismatch
          nullable: true
        expires_at:
          type: object
          example: '2026-08-03T13:30:00.000Z'
          nullable: true
        paid_at:
          type: object
          example: '2026-08-03T12:31:00.000Z'
          nullable: true
        completed_at:
          type: object
          example: '2026-08-03T12:31:10.000Z'
          nullable: true
        canceled_at:
          type: object
          example: null
          nullable: true
        created_at:
          type: string
          example: '2026-08-03T12:30:00.000Z'
        updated_at:
          type: string
          example: '2026-08-03T12:30:00.000Z'
      required:
        - id
        - object
        - business_id
        - environment
        - status
        - amount
        - currency
        - metadata
        - checkout_url
        - link_memo
        - destination_address
        - created_at
        - updated_at
    PaymentListResponseDto:
      type: object
      properties:
        object:
          type: string
          example: list
          enum:
            - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentResponseDto'
        has_more:
          type: boolean
          example: false
        next_cursor:
          type: object
          example: null
          nullable: true
      required:
        - object
        - data
        - has_more
    PaymentEventResponseDto:
      type: object
      properties:
        id:
          type: string
          example: evt_01JABC789
        object:
          type: string
          example: payment_event
          enum:
            - payment_event
        payment_id:
          type: string
          description: Internal payment ObjectId (opaque to merchants in v1 list)
          example: 665f...
        type:
          type: string
          example: payment.completed
          enum:
            - payment.created
            - payment.pending
            - payment.confirmed
            - payment.completed
            - payment.failed
            - payment.expired
            - payment.canceled
        data:
          type: object
          description: Immutable payment snapshot at event emission time
          additionalProperties: true
        created_at:
          type: string
          example: '2026-08-03T12:31:10.000Z'
      required:
        - id
        - object
        - payment_id
        - type
        - data
        - created_at
    PaymentEventListResponseDto:
      type: object
      properties:
        object:
          type: string
          example: list
          enum:
            - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentEventResponseDto'
      required:
        - object
        - data
